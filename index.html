<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messerjocke — Coming Soon</title>
  <meta name="description" content="Messerjocke — KI-Musikproduktion und Email-Automatisierung. Wir starten in Kürze.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(124,92,255,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(255,77,106,0.04) 0%, transparent 50%);
    }
    .container { max-width: 520px; }
    .logo {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
      margin-bottom: 2rem;
    }
    .logo span { color: #7c5cff; }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800;
      line-height: 1.15; letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }
    .grad {
      background: linear-gradient(135deg, #7c5cff 0%, #ff4d6a 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    p {
      color: #8888a0; font-size: 1.05rem; line-height: 1.6;
      margin-bottom: 2rem;
    }
    .contact {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 2rem; border-radius: 10px;
      background: #7c5cff; color: #fff; text-decoration: none;
      font-size: 1rem; font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 4px 24px rgba(124,92,255,0.25);
    }
    .contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124,92,255,0.4);
    }
    .links {
      margin-top: 2rem; display: flex; gap: 1.5rem;
      justify-content: center; flex-wrap: wrap;
    }
    .links a {
      color: #8888a0; text-decoration: none; font-size: 0.9rem;
      transition: color 0.2s;
    }
    .links a:hover { color: #e8e8f0; }
    .pulse {
      width: 8px; height: 8px; background: #22c55e;
      border-radius: 50%; display: inline-block;
      animation: pulse 2s infinite;
      margin-right: 0.4rem;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status {
      color: #8888a0; font-size: 0.85rem; margin-top: 2.5rem;
    }
    footer {
      position: fixed; bottom: 1.5rem; left: 0; right: 0;
      text-align: center; font-size: 0.78rem; color: #555;
    }
    footer a { color: #666; text-decoration: none; }
    footer a:hover { color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Messer<span>jocke</span></div>
    <h1>Wir arbeiten an<br>etwas <span class="grad">Großem.</span></h1>
    <p>KI-Musikproduktion und Email-Automatisierung für Creator, Marken und Unternehmen. Unser neues Angebot startet in Kürze.</p>
    <a href="mailto:messerjocke@proton.me?subject=Interesse%20an%20Messerjocke%20Services" class="contact">
      Kontakt aufnehmen
    </a>
    <div class="links">
      <a href="https://open.spotify.com/artist/4DhynD1iJwYZqwdwCwu2PD" target="_blank" rel="noopener">Spotify</a>
      <a href="https://messerjocke.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a>
    </div>
    <div class="status">
      <span class="pulse"></span> Musik bereits auf allen Streaming-Plattformen
    </div>
  </div>
  <footer>
    &copy; 2026 Messerjocke &middot;
    <a href="impressum.html">Impressum</a> &middot;
    <a href="datenschutz.html">Datenschutz</a>
  </footer>
</body>
</html>
