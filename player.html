<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messerjocke – Song Preview Player</title>
  <meta name="description" content="Messerjocke Songkatalog – Alle Songs vorhoren. Punk, Pop, Electronic und mehr.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --surface3: #222233;
      --border: #1e1e2e;
      --text: #e8e8f0;
      --muted: #8888a0;
      --accent: #7c5cff;
      --accent-dim: #5a3fd4;
      --accent-glow: rgba(124, 92, 255, 0.25);
      --hot: #ff4d6a;
      --green: #22c55e;
      --punk: #ff4d6a;
      --pop: #f59e0b;
      --electronic: #06b6d4;
      --latin: #f97316;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .header-logo span { color: var(--accent); }
    .header-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .header-back {
      margin-left: auto;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .header-back:hover { color: var(--accent); }

    /* Now Playing Hero */
    .now-playing {
      background: linear-gradient(135deg, var(--surface) 0%, #1a1028 100%);
      padding: 40px 24px 32px;
      display: flex;
      gap: 32px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .now-playing-cover {
      width: 180px;
      height: 180px;
      border-radius: var(--radius);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      transition: transform 0.3s;
    }
    .now-playing-cover.playing {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
      50% { box-shadow: 0 8px 40px var(--accent-glow), 0 0 60px var(--accent-glow); }
    }
    .now-playing-info {
      flex: 1;
      min-width: 0;
    }
    .now-playing-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .now-playing-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing-artist {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 20px;
    }

    /* Equalizer Bars */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }
    .eq-bars .bar {
      width: 3px;
      background: var(--accent);
      border-radius: 1px;
      animation: none;
    }
    .eq-bars.active .bar {
      animation: eq 0.8s ease-in-out infinite alternate;
    }
    .eq-bars .bar:nth-child(1) { height: 6px; animation-delay: 0s; }
    .eq-bars .bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .eq-bars .bar:nth-child(3) { height: 4px; animation-delay: 0.3s; }
    .eq-bars .bar:nth-child(4) { height: 12px; animation-delay: 0.1s; }
    .eq-bars .bar:nth-child(5) { height: 7px; animation-delay: 0.25s; }
    @keyframes eq {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }

    /* Transport Controls */
    .transport {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .btn-transport {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
    }
    .btn-transport:hover { color: var(--text); transform: scale(1.1); }
    .btn-transport svg { width: 20px; height: 20px; fill: currentColor; }
    .btn-play-main {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-play-main:hover { background: var(--accent-dim); transform: scale(1.05); }
    .btn-play-main svg { width: 22px; height: 22px; fill: currentColor; }

    /* Progress Bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-time {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: center;
    }
    .progress-track {
      flex: 1;
      height: 4px;
      background: var(--surface3);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      transition: height 0.15s;
    }
    .progress-track:hover { height: 6px; }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .progress-track:hover .progress-fill::after { opacity: 1; }

    /* Volume */
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .volume-wrap svg { width: 18px; height: 18px; fill: var(--muted); flex-shrink: 0; }
    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 4px;
      background: var(--surface3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }
    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    /* Genre Filters */
    .filters {
      padding: 20px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Song List */
    .song-list {
      padding: 8px 0;
    }
    .song-item {
      display: grid;
      grid-template-columns: 40px 52px 1fr auto auto 52px;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      transition: background 0.15s;
      cursor: pointer;
      border-bottom: 1px solid transparent;
    }
    .song-item:hover {
      background: var(--surface2);
    }
    .song-item.active {
      background: rgba(124, 92, 255, 0.08);
    }
    .song-num {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .song-item.active .song-num { color: var(--accent); }
    .song-item.active .song-num .num-text { display: none; }
    .song-item .song-num .eq-mini { display: none; }
    .song-item.active .song-num .eq-mini { display: inline-flex; }
    .song-cover {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .song-meta {
      min-width: 0;
    }
    .song-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item.active .song-title { color: var(--accent); }
    .song-subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .genre-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .genre-badge.punk { background: rgba(255,77,106,0.15); color: var(--punk); }
    .genre-badge.pop { background: rgba(245,158,11,0.15); color: var(--pop); }
    .genre-badge.electronic { background: rgba(6,182,212,0.15); color: var(--electronic); }
    .genre-badge.latin { background: rgba(249,115,22,0.15); color: var(--latin); }
    .song-duration {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .song-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--surface3);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .song-play-btn:hover {
      background: var(--accent);
      transform: scale(1.1);
    }
    .song-play-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* Footer */
    .footer {
      padding: 32px 24px;
      text-align: center;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }
    .footer p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--accent);
      transition: all 0.2s;
    }
    .footer-link:hover {
      background: var(--accent);
      color: #fff;
    }
    .footer-link svg { width: 16px; height: 16px; fill: currentColor; }

    /* Responsive */
    @media (max-width: 700px) {
      .now-playing {
        flex-direction: column;
        text-align: center;
        padding: 28px 16px 24px;
        gap: 20px;
      }
      .now-playing-cover { width: 140px; height: 140px; font-size: 52px; }
      .now-playing-title { font-size: 22px; }
      .now-playing-label { justify-content: center; }
      .transport { justify-content: center; }
      .volume-wrap { margin-left: 0; justify-content: center; width: 100%; }
      .progress-wrap { flex-wrap: nowrap; }
      .song-item {
        grid-template-columns: 28px 44px 1fr auto 40px;
        gap: 8px;
        padding: 10px 16px;
      }
      .song-duration { display: none; }
      .genre-badge { font-size: 10px; padding: 2px 8px; }
      .filters { padding: 16px; gap: 6px; }
      .filter-btn { padding: 6px 14px; font-size: 12px; }
      .header { padding: 16px; }
    }

    @media (max-width: 420px) {
      .song-item {
        grid-template-columns: 24px 40px 1fr 36px;
      }
      .genre-badge { display: none; }
      .song-cover { width: 40px; height: 40px; font-size: 18px; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>

      { id: 3, title: "Price of the Night", genre: "punk", duration: "2:33", seconds: 153, emoji: "\uD83C\uDF03", gradient: "linear-gradient(135deg, #1a1a4a, #ff4d6a)" },
      { id: 4, title: "Wir rei\u00DFen alles nieder", genre: "punk", duration: "3:52", seconds: 232, emoji: "\uD83D\uDD25", gradient: "linear-gradient(135deg, #4a0e0e, #d63031)" },
      { id: 5, title: "No Throne Stays Clean", genre: "punk", duration: "4:59", seconds: 299, emoji: "\uD83D\uDC51", gradient: "linear-gradient(135deg, #2d1b4e, #c0392b)" },
      { id: 6, title: "Sommer bleibt auf unserer Haut", genre: "pop", duration: "3:30", seconds: 210, emoji: "\u2600\uFE0F", gradient: "linear-gradient(135deg, #5c4a1a, #f59e0b)" },
      { id: 7, title: "Static Hearts", genre: "electronic", duration: "3:30", seconds: 210, emoji: "\uD83D\uDDA4", gradient: "linear-gradient(135deg, #0a3d5c, #06b6d4)" },
      { id: 8, title: "Stay All Night", genre: "pop", duration: "4:25", seconds: 265, emoji: "\uD83C\uDF19", gradient: "linear-gradient(135deg, #4a3a1a, #f59e0b)" },
      { id: 9, title: "Home Is You", genre: "pop", duration: "3:35", seconds: 215, emoji: "\uD83C\uDFE0", gradient: "linear-gradient(135deg, #3a2a0a, #e67e22)" },
      { id: 10, title: "Cold Receiver", genre: "electronic", duration: "4:20", seconds: 260, emoji: "\u2744\uFE0F", gradient: "linear-gradient(135deg, #0a2d4a, #0891b2)" }
    ];

    /* State */
    var currentSongIndex = -1;
    var isPlaying = false;
    var currentTime = 0;
    var progressInterval = null;
    var volume = 80;

    /* DOM references */
    var songListEl = document.getElementById('songList');
    var npCover = document.getElementById('npCover');
    var npEmoji = document.getElementById('npEmoji');
    var npTitle = document.getElementById('npTitle');
    var npArtist = document.getElementById('npArtist');
    var npLabel = document.getElementById('npLabel');
    var npEq = document.getElementById('npEq');
    var btnPlayMain = document.getElementById('btnPlayMain');
    var iconPlayMain = document.getElementById('iconPlayMain');
    var progressFill = document.getElementById('progressFill');
    var progressTrack = document.getElementById('progressTrack');
    var timeCurrent = document.getElementById('timeCurrent');
    var timeTotal = document.getElementById('timeTotal');
    var volumeSlider = document.getElementById('volumeSlider');
    var filtersEl = document.getElementById('filters');

    /* SVG Paths */
    var playPath = "M8 5v14l11-7z";
    var pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

    /* Build a single song row element */
    function buildSongRow(song, displayNum, globalIdx) {
      var isActive = globalIdx === currentSongIndex;
      var div = document.createElement('div');
      div.className = 'song-item' + (isActive ? ' active' : '');
      div.setAttribute('data-index', globalIdx);

      /* Number cell */
      var numDiv = document.createElement('div');
      numDiv.className = 'song-num';
      var numSpan = document.createElement('span');
      numSpan.className = 'num-text';
      numSpan.textContent = displayNum;
      numDiv.appendChild(numSpan);
      var eqMini = document.createElement('div');
      eqMini.className = 'eq-mini eq-bars' + (isActive && isPlaying ? ' active' : '');
      for (var b = 0; b < 5; b++) {
        var barEl = document.createElement('div');
        barEl.className = 'bar';
        eqMini.appendChild(barEl);
      }
      numDiv.appendChild(eqMini);
      div.appendChild(numDiv);

      /* Cover */
      var coverDiv = document.createElement('div');
      coverDiv.className = 'song-cover';
      coverDiv.style.background = song.gradient;
      coverDiv.textContent = song.emoji;
      div.appendChild(coverDiv);

      /* Meta */
      var metaDiv = document.createElement('div');
      metaDiv.className = 'song-meta';
      var titleDiv = document.createElement('div');
      titleDiv.className = 'song-title';
      titleDiv.textContent = song.title;
      metaDiv.appendChild(titleDiv);
      var subDiv = document.createElement('div');
      subDiv.className = 'song-subtitle';
      subDiv.textContent = 'Messerjocke';
      metaDiv.appendChild(subDiv);
      div.appendChild(metaDiv);

      /* Genre badge */
      var badge = document.createElement('span');
      badge.className = 'genre-badge ' + song.genre;
      badge.textContent = song.genre;
      div.appendChild(badge);

      /* Duration */
      var durSpan = document.createElement('span');
      durSpan.className = 'song-duration';
      durSpan.textContent = song.duration;
      div.appendChild(durSpan);

      /* Play button */
      var playBtn = document.createElement('button');
      playBtn.className = 'song-play-btn';
      playBtn.title = (isActive && isPlaying) ? 'Pause' : 'Abspielen';
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      var path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', (isActive && isPlaying) ? pausePath : playPath);
      svg.appendChild(path);
      playBtn.appendChild(svg);
      div.appendChild(playBtn);

      /* Event listeners */
      div.addEventListener('click', function() { handleSongClick(globalIdx); });
      playBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        handleSongClick(globalIdx);
      });

      return div;
    }

    /* Render Song List */
    function renderSongs(filter) {
      songListEl.textContent = '';
      var filtered = filter === 'all' ? songs : songs.filter(function(s) { return s.genre === filter; });
      for (var i = 0; i < filtered.length; i++) {
        var song = filtered[i];
        var globalIdx = songs.indexOf(song);
        songListEl.appendChild(buildSongRow(song, i + 1, globalIdx));
      }
    }

    /* Handle Click */
    function handleSongClick(index) {
      if (index === currentSongIndex) {
        togglePlay();
      } else {
        loadSong(index);
        play();
      }
    }

    /* Load Song */
    function loadSong(index) {
      currentSongIndex = index;
      var song = songs[index];
      npCover.style.background = song.gradient;
      npEmoji.textContent = song.emoji;
      npTitle.textContent = song.title;
      npArtist.textContent = 'Messerjocke';
      timeTotal.textContent = song.duration;
      currentTime = 0;
      timeCurrent.textContent = '0:00';
      progressFill.style.width = '0%';
      updateList();
    }

    /* Play / Pause */
    function play() {
      isPlaying = true;
      npLabel.textContent = 'Wird abgespielt';
      npEq.classList.add('active');
      npCover.classList.add('playing');
      iconPlayMain.querySelector('path').setAttribute('d', pausePath);
      startProgress();
      updateList();
    }

    function pause() {
      isPlaying = false;
      npLabel.textContent = 'Pausiert';
      npEq.classList.remove('active');
      npCover.classList.remove('playing');
      iconPlayMain.querySelector('path').setAttribute('d', playPath);
      stopProgress();
      updateList();
    }

    function togglePlay() {
      if (currentSongIndex === -1) {
        loadSong(0);
        play();
        return;
      }
      if (isPlaying) { pause(); } else { play(); }
    }

    /* Progress Simulation */
    function startProgress() {
      stopProgress();
      progressInterval = setInterval(function() {
        if (currentSongIndex === -1) return;
        var song = songs[currentSongIndex];
        currentTime += 0.25;
        if (currentTime >= song.seconds) {
          nextSong();
          return;
        }
        var pct = (currentTime / song.seconds) * 100;
        progressFill.style.width = pct + '%';
        timeCurrent.textContent = formatTime(currentTime);
      }, 250);
    }

    function stopProgress() {
      if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
      }
    }

    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    /* Seek */
    progressTrack.addEventListener('click', function(e) {
      if (currentSongIndex === -1) return;
      var rect = progressTrack.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      var song = songs[currentSongIndex];
      currentTime = pct * song.seconds;
      progressFill.style.width = (pct * 100) + '%';
      timeCurrent.textContent = formatTime(currentTime);
    });

    /* Navigation */
    function nextSong() {
      var next = (currentSongIndex + 1) % songs.length;
      loadSong(next);
      play();
    }

    function prevSong() {
      if (currentTime > 3) {
        currentTime = 0;
        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
        return;
      }
      var prev = (currentSongIndex - 1 + songs.length) % songs.length;
      loadSong(prev);
      play();
    }

    /* Volume */
    volumeSlider.addEventListener('input', function(e) {
      volume = parseInt(e.target.value, 10);
    });

    /* Filter */
    filtersEl.addEventListener('click', function(e) {
      if (!e.target.classList.contains('filter-btn')) return;
      var btns = filtersEl.querySelectorAll('.filter-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      e.target.classList.add('active');
      renderSongs(e.target.getAttribute('data-genre'));
    });

    /* Update List Active States */
    function updateList() {
      var items = songListEl.querySelectorAll('.song-item');
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var idx = parseInt(item.getAttribute('data-index'), 10);
        var active = idx === currentSongIndex;
        if (active) { item.classList.add('active'); } else { item.classList.remove('active'); }
        var eqMini = item.querySelector('.eq-mini');
        if (eqMini) {
          if (active && isPlaying) { eqMini.classList.add('active'); } else { eqMini.classList.remove('active'); }
        }
        var btnPath = item.querySelector('.song-play-btn svg path');
        if (btnPath) {
          btnPath.setAttribute('d', (active && isPlaying) ? pausePath : playPath);
        }
      }
    }

    /* Wire Buttons */
    btnPlayMain.addEventListener('click', togglePlay);
    document.getElementById('btnPrev').addEventListener('click', prevSong);
    document.getElementById('btnNext').addEventListener('click', nextSong);

    /* Keyboard Controls */
    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        togglePlay();
      }
      if (e.code === 'ArrowRight') nextSong();
      if (e.code === 'ArrowLeft') prevSong();
    });

    /* Init */
    renderSongs('all');
  </script>

</body>
</html>
