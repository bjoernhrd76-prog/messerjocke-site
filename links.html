<!DOCTYPE html>
<html lang="de">
<head>

  <meta property="og:title" content="Messerjocke – Links">
  <meta property="og:description" content="KI-Musik & Email-Automatisierung. Alle Links auf einen Blick.">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --muted: #8888a0;
      --accent: #7c5cff;
      --accent2: #a78bfa;
      --accent-glow: rgba(124, 92, 255, 0.3);
      --hot: #ff4d6a;
      --green: #22c55e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Animated background --- */
    .bg-glow {
      position: fixed;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,92,255,0.12) 0%, rgba(124,92,255,0.03) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulse-glow 6s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0%   { opacity: 0.6; transform: translateX(-50%) scale(1); }
      100% { opacity: 1;   transform: translateX(-50%) scale(1.15); }
    }

    /* --- Container --- */
    .container {
      position: relative;
      z-index: 1;
      max-width: 440px;
      margin: 0 auto;
      padding: 48px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* --- Profile section --- */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
    }

    .avatar-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(
        var(--accent),
        var(--hot),
        var(--accent2),
        var(--accent)
      );
      animation: ring-spin 4s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes ring-spin {
      to { filter: hue-rotate(360deg); }
    }

    .avatar-ring img,
    .avatar-ring .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--bg);
    }

    .avatar-placeholder {
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      user-select: none;
    }

    .profile h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .profile .tagline {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      max-width: 280px;
    }

    /* --- Links list --- */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* --- Link button --- */
    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      cursor: pointer;
    }

    /* Gradient border shimmer on hover */
    .link-btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 17px;
      padding: 1px;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--hot),
        var(--accent2),
        var(--accent)
      );
      background-size: 300% 300%;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: gradient-flow 3s ease infinite;
    }

    @keyframes gradient-flow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .link-btn:hover::before,
    .link-btn:focus-visible::before {
      opacity: 1;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124, 92, 255, 0.15);
      background: var(--surface2);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Icon circle */
    .link-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(124, 92, 255, 0.12);
    }

    .link-icon.spotify  { background: rgba(30, 215, 96, 0.12); }
    .link-icon.hot      { background: rgba(255, 77, 106, 0.12); }
    .link-icon.email    { background: rgba(124, 92, 255, 0.12); }
    .link-icon.calc     { background: rgba(34, 197, 94, 0.12); }
    .link-icon.tiktok   { background: rgba(255, 255, 255, 0.08); }
    .link-icon.web      { background: rgba(124, 92, 255, 0.12); }

    .link-text {
      flex: 1;
    }

    .link-arrow {
      color: var(--muted);
      font-size: 18px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .link-btn:hover .link-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* Featured link (new song) */
    .link-btn.featured {
      background: linear-gradient(135deg, rgba(124,92,255,0.15), rgba(255,77,106,0.1));
      border-color: rgba(124, 92, 255, 0.3);
    }

    .link-btn.featured::before {
      opacity: 0.5;
    }

    .link-btn.featured:hover::before {
      opacity: 1;
    }

    .badge-new {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bg);
      background: var(--hot);
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* --- Divider --- */
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 8px 0;
      border: none;
    }

    /* --- Footer --- */
    .footer {
      margin-top: 40px;
      text-align: center;
      padding-bottom: 24px;
    }

    .footer-email {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-email:hover {
      color: var(--accent);
    }

    .footer-brand {
      font-size: 11px;
      color: rgba(136, 136, 160, 0.4);
      margin-top: 12px;
      letter-spacing: 0.05em;
    }

    /* --- Entrance animation --- */
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile        { animation: fade-up 0.5s ease both; }
    .link-btn:nth-child(1)  { animation: fade-up 0.5s ease 0.08s both; }
    .link-btn:nth-child(2)  { animation: fade-up 0.5s ease 0.14s both; }
    .link-btn:nth-child(3)  { animation: fade-up 0.5s ease 0.20s both; }
    .link-btn:nth-child(4)  { animation: fade-up 0.5s ease 0.26s both; }
    .link-btn:nth-child(5)  { animation: fade-up 0.5s ease 0.32s both; }
    .link-btn:nth-child(6)  { animation: fade-up 0.5s ease 0.38s both; }
    .link-btn:nth-child(7)  { animation: fade-up 0.5s ease 0.44s both; }
    .links .divider          { animation: fade-up 0.5s ease 0.30s both; }
    .footer         { animation: fade-up 0.5s ease 0.55s both; }

    /* --- Responsive --- */
    @media (max-width: 480px) {
      .container {
        padding: 36px 16px 32px;
      }
      .link-btn {
        padding: 14px 16px;
        font-size: 14px;
      }
      .link-icon {
        width: 34px;
        height: 34px;
        min-width: 34px;
        font-size: 16px;
      }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
